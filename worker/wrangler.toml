name = "svu-verification-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Custom domain configuration
[[routes]]
pattern = "svu-mitgliedschaft.untereuerheim.com"
custom_domain = true

# Environment variables (non-sensitive)
[vars]
# None needed - all sensitive data goes in secrets

# Secrets configuration (use: wrangler secret put <KEY>)
# Required secrets:
# - DATABASE_URL: Neon PostgreSQL connection string
# - ADMIN_USERNAME: Admin panel HTTP Basic Auth username
# - ADMIN_PASSWORD: Admin panel HTTP Basic Auth password

# Development configuration
[env.development]
name = "svu-verification-worker-dev"
